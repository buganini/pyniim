name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    # A hung asyncio test used to burn the 6 hour default before being cancelled.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  package:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      # build produces an sdist, then builds the wheel from that sdist.
      - run: python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/pyniim-wheel
          /tmp/pyniim-wheel/bin/python -m pip install dist/*.whl
          /tmp/pyniim-wheel/bin/pyniim info models --json
          /tmp/pyniim-wheel/bin/pyniim info env --json
          /tmp/pyniim-wheel/bin/pyniim convert -l 40x30 examples/test-label.png -o /tmp/test.niim
          /tmp/pyniim-wheel/bin/pyniim analyze /tmp/test.niim --json
